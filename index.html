<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ADMIN PANEL | MAGIC SCRIPTS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="https://i.ibb.co/xqXhx24Z/MS.png" type="image/x-icon">

    <!-- ICONS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .transaction {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            animation: fade .3s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .label {
            width: 160px;
            font-weight: bold;
            color: #333;
        }

        .value {
            flex: 1;
            color: #555;
            word-break: break-word;
            width: 100%;
        }

        .row.stack {
            flex-direction: column;
        }

        .row.stack .label {
            width: 100%;
            margin-bottom: 4px;
        }

        .row.stack .value {
            width: 100%;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100vw;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px 6px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .vid-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            width: 100%;
            animation: fade .2s ease;
        }

        .vid-row input[name="eid[]"] {
            width: 100%;
        }

        .vid-row input[name="name[]"] {
            width: 90px;
            max-width: 120px;
        }

        .vid-btn {
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 14px;
            padding: 9px 10px;
            border-radius: 4px;
            min-width: 45px;
        }

        .vid-btn.add {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .vid-btn.remove {
            background: #fdecea;
            color: #c62828;
        }

        .save-btn {
            border: none;
            background: #111;
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .logout-btn {
            border: none;
            background: #ffebee;
            color: #c62828;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .top-title {
            font-size: 2rem;
            font-weight: 900;
            color: #000;
            text-shadow: 0 5px 25px rgba(0, 0, 0, 0.35);
            letter-spacing: 1px;
            text-align: center;
        }

        .sub-title {
            font-size: 1rem;
            color: #5a5a5a;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 900;
        }

        #loginPage {
            max-width: 400px;
            margin: auto;
            margin-top: 70px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111;
            color: #fff;
            padding: 12px 18px;
            border-radius: 6px;
            z-index: 9999;
            display: none;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        @media(max-width:600px) {
            body {
                padding: 12px;
            }

            .transaction {
                padding: 15px;
            }

            .vid-row {
                flex-wrap: nowrap;
            }
        }
    </style>
</head>

<body>

    <div id="toast" class="toast"></div>

    <!-- LOGIN PAGE -->

    <div id="loginPage" style="display:none;">

        <div class="top-title">
            MAGIC SCRIPTS
        </div>

        <div class="sub-title">
            (ADMIN LOGIN)
        </div>

        <div class="transaction">

            <div class="row stack">
                <div class="label">Email</div>

                <div class="value">
                    <input type="email" id="email" placeholder="Enter Email">
                </div>
            </div>

            <div class="row stack">
                <div class="label">Password</div>

                <div class="value">
                    <input type="password" id="password" placeholder="Enter Password">
                </div>
            </div>

            <div style="margin-top:20px;">
                <button class="save-btn" onclick="login()">
                    <i class="fa-solid fa-lock"></i>
                    Login
                </button>
            </div>

        </div>
    </div>

    <!-- MAIN PAGE -->

    <div id="mainPage" style="display:none;">

        <div class="top-title">
            MAGIC SCRIPTS
        </div>

        <div class="sub-title">
            (MAGIC SCRIPTS ADMIN PANEL)
        </div>

        <form class="transaction">

            <!-- TOP BUTTONS -->

            <div class="top-buttons">

                <!-- LOGOUT LEFT -->

                <button type="button" class="logout-btn" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </button>

                <!-- ADD RIGHT -->

                <button type="button" class="vid-btn add" onclick="addVid()">
                    <i class="fa-solid fa-plus"></i>
                </button>

            </div>

            <!-- USERS -->

            <div class="row stack">

                <div class="label">EID(s)</div>

                <div class="value" id="usersContainer">

                </div>

            </div>

            <!-- SAVE -->

            <div style="margin-top:20px;">

                <button type="button" class="save-btn" onclick="saveAll()">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Changes
                </button>

            </div>

        </form>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getDatabase,
            ref,
            get,
            set,
            remove
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBdVcyIj9IunVpgYczg4AJsw-PzG49hUg",
            authDomain: "ahmad-admin-panel.firebaseapp.com",
            databaseURL: "https://ahmad-admin-panel-default-rtdb.firebaseio.com",
            projectId: "ahmad-admin-panel",
            storageBucket: "ahmad-admin-panel.firebasestorage.app",
            messagingSenderId: "670852174350",
            appId: "1:670852174350:web:0c60c614cc58ed24a5a25f"
        };

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getDatabase(app);

        const loginPage = document.getElementById("loginPage");

        const mainPage = document.getElementById("mainPage");

        function toast(msg) {

            const t = document.getElementById("toast");

            t.innerText = msg;

            t.style.display = "block";

            setTimeout(() => {

                t.style.display = "none";

            }, 2000);
        }

        // AUTO LOGIN

        onAuthStateChanged(auth, (user) => {

            if (user) {

                loginPage.style.display = "none";

                mainPage.style.display = "block";

                loadUsers();

            } else {

                loginPage.style.display = "block";

                mainPage.style.display = "none";
            }
        });

        // LOGIN

        window.login = async function () {

            const email = document.getElementById("email").value;

            const password = document.getElementById("password").value;

            try {

                await signInWithEmailAndPassword(auth, email, password);

                toast("Login Success");

            } catch (e) {

                toast("Login Failed");
            }
        }

        // LOGOUT

        window.logout = async function () {

            await signOut(auth);

            toast("Logout Success");
        }

        // ADD USER TOP

        window.addVid = function () {

            const container = document.getElementById("usersContainer");

            const row = document.createElement("div");

            row.className = "vid-row";

            row.innerHTML = `
                <input type="text" name="eid[]" maxlength="20" placeholder="Enter EID">

                <input type="text" name="name[]" maxlength="50" placeholder="Name">

                <button type="button" class="vid-btn remove" onclick="removeVid(this)">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;

            // NEW INPUTS TOP
            container.prepend(row);
        }

        // REMOVE USER

        window.removeVid = async function (btn) {

            const row = btn.parentElement;

            const eid = row.querySelector('input[name="eid[]"]').value;

            row.remove();

            if (eid) {

                await remove(ref(db, "users/" + eid));

                toast("User Removed");
            }
        }

        // LOAD USERS

        async function loadUsers() {

            const container = document.getElementById("usersContainer");

            container.innerHTML = "";

            const snapshot = await get(ref(db, "users"));

            if (!snapshot.exists()) return;

            const data = snapshot.val();

            const reversed = Object.keys(data).reverse();

            reversed.forEach(key => {

                const user = data[key];

                const row = document.createElement("div");

                row.className = "vid-row";

                row.innerHTML = `
                    <input type="text" 
                    name="eid[]" 
                    maxlength="20" 
                    value="${user.eid || ''}">

                    <input type="text" 
                    name="name[]" 
                    maxlength="50" 
                    value="${user.name || ''}">

                    <button type="button" 
                    class="vid-btn remove" 
                    onclick="removeVid(this)">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;

                container.appendChild(row);
            });
        }

        // SAVE

        window.saveAll = async function () {

            const rows = document.querySelectorAll(".vid-row");

            for (const row of rows) {

                const eid = row.querySelector('input[name="eid[]"]').value.trim();

                const name = row.querySelector('input[name="name[]"]').value.trim();

                if (!eid) continue;

                await set(ref(db, "users/" + eid), {
                    eid,
                    name
                });
            }

            toast("Saved Successfully");

            setTimeout(() => {

                location.reload();

            }, 1000);
        }

    </script>

</body>

</html>
